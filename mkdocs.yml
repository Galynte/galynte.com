site_name: Galynte
site_url: https://galynte.com
site_description: TapOut, PuttTap, and Shush from Galynte.
site_author: Galynte

docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2026 Galynte

extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/mark.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

plugins:
  - privacy

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
